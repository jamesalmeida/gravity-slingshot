# The Xcode project is generated from this file: run `xcodegen` in this folder after adding,
# moving or removing source files. VoyagerSlingshot.xcodeproj is committed so the app opens in
# Xcode without XcodeGen installed.
name: VoyagerSlingshot
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SlingshotCore:
    path: SlingshotCore
targets:
  VoyagerSlingshot:
    type: application
    platform: iOS
    sources:
      - VoyagerSlingshot
    dependencies:
      - package: SlingshotCore
    info:
      path: VoyagerSlingshot/Info.plist
      properties:
        CFBundleDisplayName: Voyager Slingshot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.puzzle-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesalmeida.voyagerslingshot
        PRODUCT_NAME: Voyager Slingshot
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
schemes:
  VoyagerSlingshot:
    build:
      targets:
        VoyagerSlingshot: all
    run:
      config: Debug
