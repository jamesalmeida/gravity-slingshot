# The Xcode project is generated from this file: run `xcodegen` in this folder after adding,
# moving or removing source files. OneShot.xcodeproj is committed so the app opens in
# Xcode without XcodeGen installed.
name: OneShot
options:
  # GSV iOS conventions: /Users/james/dev/AGENTS.md and agent-playbooks ios/README.md.
  bundleIdPrefix: com.gsv
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SlingshotCore:
    path: SlingshotCore
  # Shared GSV kit, always by git tag (never a local path: Xcode cannot open two apps that
  # share a path package).
  GSVKit:
    url: https://github.com/jamesalmeida/gsv-ios-kit.git
    exactVersion: 0.2.26

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "WZRRA4NFBY"
    CODE_SIGN_STYLE: Automatic
    # Build numbers are YYYY.MM.DD.N. Bump before every archive; never let Xcode manage it.
    CURRENT_PROJECT_VERSION: "2026.11.19.1"
    MARKETING_VERSION: "1.0"
targets:
  OneShot:
    type: application
    platform: iOS
    sources:
      - path: OneShot
        excludes:
          - "Resources/RELEASE-NOTES.md"
      # GSVAbout reads this from the app bundle.
      - path: OneShot/Resources/RELEASE-NOTES.md
        buildPhase: resources
    dependencies:
      - package: SlingshotCore
      - package: GSVKit
        product: GSVAbout
    info:
      path: OneShot/Info.plist
      properties:
        CFBundleDisplayName: One Shot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.puzzle-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gsv.oneshot
        PRODUCT_NAME: One Shot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
schemes:
  OneShot:
    build:
      targets:
        OneShot: all
    run:
      config: Debug
